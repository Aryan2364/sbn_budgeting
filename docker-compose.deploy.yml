# Runs the PRE-BUILT images from GHCR. This is the file you use ON THE SERVER.
# It does NOT build anything — it pulls the images GitHub Actions already built.
#
# Usage on the server:
#   ./deploy.sh
#
# Requires a .env.production file next to this one (see .env.production.example).
services:
  backend:
    image: ghcr.io/aryan2364/sbn-backend:latest
    env_file: .env.production
    environment:
      PORT: 4000
      CORS_ORIGIN: https://sbn.rgbindia.com
      TZ: Asia/Kolkata
    ports:
      - "4400:4000"
    restart: unless-stopped
    networks:
      - sbn_prod

  frontend:
    image: ghcr.io/aryan2364/sbn-frontend:latest
    environment:
      TZ: Asia/Kolkata
    ports:
      - "3400:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sbn_prod

  # Not started by `up`. deploy.sh invokes it with `docker compose run --rm
  # migrate`, so the schema is applied by the same image that serves the API.
  migrate:
    image: ghcr.io/aryan2364/sbn-backend:latest
    env_file: .env.production
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    profiles: ["tools"]
    networks:
      - sbn_prod

  # Also manual: creates the 19 cost heads, and the first admin if
  # SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD are set. Safe to re-run.
  seed:
    image: ghcr.io/aryan2364/sbn-backend:latest
    env_file: .env.production
    command: ["node", "dist/db/seed.js"]
    restart: "no"
    profiles: ["tools"]
    networks:
      - sbn_prod

networks:
  sbn_prod:
    driver: bridge
